<!-- ════════════════════════════════════════════════════════════════════
     CONFIGURATION ERROR SCREEN
     Shown only if the build was deployed without SUPABASE_URL /
     SUPABASE_ANON_KEY baked into env.js — see build/build.js and
     docs/SETUP.md. In a correctly deployed SaaS instance, end users
     never see this; it exists purely so a broken deploy fails loudly
     and obviously instead of silently breaking every API call.
     ════════════════════════════════════════════════════════════════════ -->
<div id="config-error-screen" style="display:none;position:fixed;inset:0;z-index:999;align-items:center;justify-content:center;padding:16px;background:var(--bg,#0a0e1a);">
  <div class="setup-card">
    <div class="setup-logo">Lex<span>Desk</span></div>
    <p style="font-size:13px;color:var(--danger);margin-bottom:12px;">
      <i class="fas fa-exclamation-triangle"></i> Configuration error
    </p>
    <p style="font-size:13px;color:var(--text-muted);line-height:1.6;">
      This deployment is missing its Supabase connection details
      (<code>SUPABASE_URL</code> / <code>SUPABASE_ANON_KEY</code>).
      This is a build-time configuration issue, not something an end
      user can fix — please contact your administrator or see
      <code>docs/SETUP.md</code> in the LexDesk repository.
    </p>
  </div>
</div>
