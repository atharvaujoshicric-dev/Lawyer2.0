<div class="page-view" id="view-clients">
        <div class="search-bar">
          <div class="search-input-wrap"><i class="fas fa-search"></i><input class="search-input" id="client-search" type="text" placeholder="Search by name, ID…" oninput="renderClientTable()"/></div>
          <select class="form-control" id="filter-type" style="width:auto;" onchange="renderClientTable()"><option value="">All Types</option></select>
          <select class="form-control" id="filter-status" style="width:auto;" onchange="renderClientTable()"><option value="">All Statuses</option><option value="active">Active</option><option value="pending">Pending</option><option value="closed">Closed</option></select>
          <select class="form-control" id="filter-assignee" style="width:auto;" onchange="renderClientTable()"><option value="">All Lawyers</option></select>
          <button class="btn btn-gold" onclick="openAddClient()"><i class="fas fa-plus"></i> New Client</button>
        </div>
        <div class="card">
          <div class="table-wrap"><table class="data-table"><thead><tr><th>Client</th><th>Case Type</th><th>Assigned To</th><th>Status</th><th>Next Deadline</th><th>Actions</th></tr></thead><tbody id="clients-tbody"></tbody></table></div>
          <div id="clients-empty" class="empty-state" style="display:none;"><i class="fas fa-users"></i><div class="empty-state-title">No clients found</div></div>
        </div>
      </div
