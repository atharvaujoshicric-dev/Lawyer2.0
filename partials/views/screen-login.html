<div id="login-screen" style="display:none;">
  <div class="login-card">
    <div style="font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--navy);margin-bottom:4px;">Lex<span style="color:var(--gold);">Desk</span></div>
    <div id="auth-tabs" style="display:flex;gap:6px;margin:14px 0 18px;background:var(--bg);border-radius:8px;padding:4px;">
      <button class="btn btn-sm" id="tab-signin" style="flex:1;justify-content:center;background:var(--navy);color:#fff;" onclick="showAuthTab('signin')">Sign In</button>
      <button class="btn btn-sm btn-outline" id="tab-signup" style="flex:1;justify-content:center;border:none;" onclick="showAuthTab('signup')">Sign Up</button>
    </div>

    <div id="auth-signin">
      <div class="form-grid" style="gap:13px;">
        <div class="form-group"><label class="form-label">Email</label><input class="form-control" id="li-email" type="email" onkeydown="if(event.key==='Enter')doSignIn()"/></div>
        <div class="form-group"><label class="form-label">Password</label><input class="form-control" id="li-pwd" type="password" onkeydown="if(event.key==='Enter')doSignIn()"/></div>
      </div>
      <p id="li-err" style="color:var(--danger);font-size:12px;margin-top:8px;display:none;"></p>
      <button class="btn btn-gold w-full mt-4" style="justify-content:center;font-size:15px;padding:12px;" onclick="doSignIn()"><i class="fas fa-sign-in-alt"></i> Sign In</button>
      <div style="text-align:center;margin-top:12px;">
        <span style="font-size:12.5px;color:var(--text-muted);cursor:pointer;text-decoration:underline;" onclick="doForgotPassword()">Forgot password?</span>
      </div>
    </div>

    <div id="auth-signup" style="display:none;">
      <!-- Mode selector: starting a brand-new firm vs joining one that
           already exists on LexDesk via an invite code from its admin -->
      <input type="hidden" id="su-mode-selected" value="new"/>
      <div style="display:flex;gap:6px;margin-bottom:14px;">
        <button type="button" class="su-mode-btn active" data-mode="new" onclick="toggleSignupMode('new')"
          style="flex:1;padding:9px;border-radius:8px;font-size:12.5px;font-weight:500;cursor:pointer;
                 border:1.5px solid var(--gold);background:var(--gold-dim);color:var(--gold);">
          <i class="fas fa-building"></i> Start a new firm
        </button>
        <button type="button" class="su-mode-btn" data-mode="invite" onclick="toggleSignupMode('invite')"
          style="flex:1;padding:9px;border-radius:8px;font-size:12.5px;font-weight:500;cursor:pointer;
                 border:1.5px solid var(--border);background:var(--glass);color:var(--text-secondary);">
          <i class="fas fa-user-friends"></i> Join with invite code
        </button>
      </div>

      <div class="form-grid" style="gap:13px;">
        <div class="form-group"><label class="form-label">Full Name <span class="required">*</span></label><input class="form-control" id="su-name" type="text"/></div>
        <div class="form-group"><label class="form-label">Email <span class="required">*</span></label><input class="form-control" id="su-email" type="email"/></div>
        <div class="form-group"><label class="form-label">Password <span class="required">*</span></label><input class="form-control" id="su-pwd" type="password" placeholder="Min. 8 characters"/></div>

        <div id="su-newfirm-fields">
          <div class="form-group"><label class="form-label">Firm / Chamber Name <span class="required">*</span></label><input class="form-control" id="su-firm-name" type="text" placeholder="e.g. Sharma & Associates"/></div>
          <div class="form-group"><label class="form-label">Bar Council State</label>
            <select class="form-control" id="su-bar-state">
              <option value="">— Select (optional) —</option>
              <option>Andhra Pradesh</option><option>Bihar</option><option>Delhi</option>
              <option>Gujarat</option><option>Karnataka</option><option>Kerala</option>
              <option>Madhya Pradesh</option><option>Maharashtra & Goa</option>
              <option>Punjab & Haryana</option><option>Rajasthan</option>
              <option>Tamil Nadu</option><option>Telangana</option>
              <option>Uttar Pradesh</option><option>West Bengal</option><option>Other</option>
            </select>
          </div>
          <p class="form-hint">You'll be the admin of this firm and get a 14-day free trial automatically.</p>
        </div>

        <div id="su-invite-fields" style="display:none;">
          <div class="form-group"><label class="form-label">Invite Code <span class="required">*</span></label><input class="form-control" id="su-invite-code" type="text" placeholder="Ask your firm admin for this code"/></div>
          <p class="form-hint">Your account will need approval from your firm's admin before you can log in.</p>
        </div>
      </div>
      <p id="su-err" style="color:var(--danger);font-size:12px;margin-top:8px;display:none;"></p>
      <button class="btn btn-gold w-full mt-4" style="justify-content:center;font-size:15px;padding:12px;" onclick="doSignUp()"><i class="fas fa-user-plus"></i> Create Account</button>
    </div>
  </div>
</div>
