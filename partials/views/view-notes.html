<div class="page-view" id="view-notes">
        <div style="display:flex;justify-content:flex-end;margin-bottom:16px;">
          <button class="btn btn-gold" onclick="openNoteEditor()"><i class="fas fa-plus"></i> New Note</button>
        </div>
        <div id="notes-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;"></div>
        <div id="notes-empty" class="empty-state" style="display:none;"><i class="fas fa-sticky-note"></i><div class="empty-state-title">No notes yet</div><div class="empty-state-desc">Create private notes and share them with your team</div></div>
      </div
