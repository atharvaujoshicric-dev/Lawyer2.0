<div class="page-view" id="view-tasks">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
          <div class="search-bar" style="margin-bottom:0;flex:1;">
            <select class="form-control" id="task-filter-status" style="width:auto;" onchange="renderTasks()"><option value="">All Statuses</option><option value="open">Open</option><option value="in_progress">In Progress</option><option value="in_review">In Review</option><option value="done">Done</option><option value="cancelled">Cancelled</option></select>
          </div>
          <button class="btn btn-gold" id="new-task-btn" onclick="openTaskModal()"><i class="fas fa-plus"></i> New Task</button>
        </div>
        <div class="kanban" id="tasks-kanban" style="grid-template-columns:repeat(5,1fr);">
          <div class="kanban-col"><div class="kanban-col-title">Open <span id="kc-open-count">0</span></div><div id="kc-open"></div></div>
          <div class="kanban-col"><div class="kanban-col-title">In Progress <span id="kc-in-progress-count">0</span></div><div id="kc-in-progress"></div></div>
          <div class="kanban-col"><div class="kanban-col-title">In Review <span id="kc-in-review-count">0</span></div><div id="kc-in-review"></div></div>
          <div class="kanban-col"><div class="kanban-col-title">Done <span id="kc-done-count">0</span></div><div id="kc-done"></div></div>
          <div class="kanban-col"><div class="kanban-col-title">Cancelled <span id="kc-cancelled-count">0</span></div><div id="kc-cancelled"></div></div>
        </div>
      </div
