<div class="page-view" id="view-formbuilder">
        <div class="card mb-4">
          <div class="card-header">
            <span class="card-title">Select Category to Configure</span>
            <button class="btn btn-gold btn-sm" onclick="openNewCategoryModal()"><i class="fas fa-plus"></i> New Category</button>
          </div>
          <div class="card-body"><div id="fb-category-tabs" class="case-type-selector" style="margin-bottom:0;"></div></div>
        </div>
        <div id="fb-editor" style="display:none;">
          <div class="card">
            <div class="card-header">
              <span class="card-title" id="fb-cat-label">Fields</span>
              <div style="display:flex;gap:8px;">
                <button class="btn btn-outline btn-sm" onclick="addFormField()"><i class="fas fa-plus"></i> Add Field</button>
                <button class="btn btn-gold btn-sm" onclick="saveFormSchema()"><i class="fas fa-save"></i> Save Schema</button>
              </div>
            </div>
            <div class="card-body">
              <p class="text-sm text-muted mb-3">Drag to reorder · Toggle Required · Change type · Delete field.</p>
              <div id="fb-fields-list"></div>
            </div>
          </div>
        </div>
      </div
