<div class="page-view" id="view-finances">
        <div class="finances-summary" id="fin-summary-cards"></div>
        <div class="card">
          <div class="card-header">
            <span class="card-title">Client Fee Tracker</span>
            <div style="display:flex;gap:8px;align-items:center;">
              <input class="search-input" id="fin-search" type="text" placeholder="Search client…" oninput="renderFinances()" style="padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;width:200px;"/>
              <select class="form-control" id="fin-filter-status" style="width:auto;" onchange="renderFinances()">
                <option value="">All</option>
                <option value="unpaid">Unpaid</option>
                <option value="partial">Partial</option>
                <option value="paid">Paid in Full</option>
              </select>
            </div>
          </div>
          <div class="card-body" id="fin-client-list"></div>
        </div>
      </div
