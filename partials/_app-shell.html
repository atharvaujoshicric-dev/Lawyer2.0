<div id="app" style="display:none;">
  <button id="sidebar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <aside id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-text">LexDesk</div>
      <div class="logo-sub">Legal Practice Manager</div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar" id="sb-avatar">--</div>
        <div style="min-width:0;">
          <div class="user-name" id="sb-name">Loading…</div>
          <div class="user-role" id="sb-role">—</div>
        </div>
      </div>
      <button class="sidebar-logout" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
    </div>
  </aside>

  <div id="main">
    <header id="topbar">
      <span class="topbar-title" id="topbar-title">Dashboard</span>
      <div class="topbar-actions">
        <div class="sync-badge" id="sync-badge"><div class="sync-dot" id="sync-dot"></div><span id="sync-text">Live</span></div>
        <button class="btn btn-gold btn-sm" id="topbar-new-client-btn" onclick="openAddClient()"><i class="fas fa-plus"></i> <span class="hide-xs">New Client</span></button>
      </div>
    </header>
    <div id="page">

      <!-- views injected here at runtime by assets/js/00-partial-loader.js -->

    </div><!-- /page -->
  </div><!-- /main -->
</div><!-- /app -->
