<!-- ══ SETUP (first admin) ══ -->
<div id="setup-screen">
  <div class="setup-card">
    <div class="setup-logo">Lex<span>Desk</span></div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:18px;">Secure Legal Practice Management — connect your database</p>
    <div id="setup-config-step">
      <div class="form-group" style="margin-bottom:12px;">
        <label class="form-label">Supabase Project URL</label>
        <input class="form-control" id="cfg-url" type="text" placeholder="https://xxxx.supabase.co"/>
      </div>
      <div class="form-group" style="margin-bottom:16px;">
        <label class="form-label">Supabase Anon Key</label>
        <input class="form-control" id="cfg-key" type="text" placeholder="eyJhbGciOi..."/>
      </div>
      <button class="btn btn-primary w-full" style="justify-content:center;" onclick="saveSupabaseConfig()">Connect <i class="fas fa-arrow-right"></i></button>
      <p class="form-hint mt-2">Run <code>supabase_schema.sql</code> in your Supabase SQL Editor first (one-time setup).</p>
    </div>
  </div>
</div>
