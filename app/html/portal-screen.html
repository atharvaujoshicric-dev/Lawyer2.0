<!-- ══ CLIENT PORTAL LOGIN ══ -->
<div id="portal-screen" style="display:none;position:fixed;inset:0;background:var(--navy);z-index:998;align-items:center;justify-content:center;padding:16px;">
  <div class="login-card">
    <div style="font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--navy);margin-bottom:4px;">Lex<span style="color:var(--gold);">Desk</span></div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:18px;">Client Portal — Enter your 4-digit PIN to view your case details.</p>
    <div class="form-group" style="margin-bottom:14px;">
      <label class="form-label">Your PIN</label>
      <input class="form-control" id="portal-pin" type="password" maxlength="4" placeholder="4-digit PIN" style="font-size:22px;letter-spacing:8px;text-align:center;" onkeydown="if(event.key==='Enter')portalLogin()"/>
    </div>
    <p id="portal-err" style="color:var(--danger);font-size:12px;margin-bottom:10px;display:none;"></p>
    <button class="btn btn-gold w-full" style="justify-content:center;font-size:15px;padding:12px;" onclick="portalLogin()"><i class="fas fa-unlock"></i> View My Case</button>
  </div>
</div>
