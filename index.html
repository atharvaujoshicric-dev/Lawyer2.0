<div class="lexdesk-orbs" aria-hidden="true">

<!--
  Screens, the #app shell, every view, and every modal are NOT in this
  file. They live as separate HTML fragments under partials/ and are
  fetched + injected at runtime by assets/js/00-partial-loader.js.

  This is what lets GitHub Pages serve the app with zero build step:
  there's nothing to "assemble" ahead of time — the browser does it on
  page load. If you need to edit a specific screen, find it directly in
  partials/views/ or partials/modals/ rather than searching this file.
-->

<!-- Environment config — your Supabase URL/key, see assets/js/env.js -->
<script src="assets/js/env.js"></script>

<!-- Partial loader — MUST run before every other app script -->
<script src="assets/js/00-partial-loader.js"></script>

<!-- App modules — load order matters, see assets/js/README.md -->
<script src="assets/js/01-supabase-config.js"></script>
